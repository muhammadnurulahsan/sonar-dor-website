name: বাজুস দাম হালনাগাদ ও সাইট প্রকাশ

on:
  schedule:
    - cron: "*/20 * * * *"     # প্রতি ২০ মিনিটে বাজুসের দাম যাচাই (GitHub কখনো কয়েক মিনিট দেরি করে)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      k22:
        description: "২২ ক্যারেট (ভরি) — খালি রাখলে বাজুস থেকে নিজে আনবে"
        required: false
      k21:
        description: "২১ ক্যারেট (ভরি)"
        required: false
      k18:
        description: "১৮ ক্যারেট (ভরি)"
        required: false
      trad:
        description: "সনাতন পদ্ধতি (ভরি)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bajus-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bajus.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: বাজুসের দাম আনা
        id: bajus
        env:
          MANUAL_K22: ${{ github.event.inputs.k22 }}
          MANUAL_K21: ${{ github.event.inputs.k21 }}
          MANUAL_K18: ${{ github.event.inputs.k18 }}
          MANUAL_TRAD: ${{ github.event.inputs.trad }}
        run: node scripts/update-bajus.mjs
      - name: নতুন দাম সেভ করা
        if: steps.bajus.outputs.changed == 'true'
        run: |
          git config user.name "sonar-dor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/bajus.json
          git commit -m "বাজুসের নতুন দাম $(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: সাইটের ফাইল আলাদা করা
        run: |
          mkdir _site
          cp -r index.html 404.html assets manifest.webmanifest robots.txt sitemap.xml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
